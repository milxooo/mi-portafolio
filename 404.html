<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pagina no encontrada - Portafolio de Julian Forero">

    <!-- Hardening: Cabeceras de Seguridad -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'none'; base-uri 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <title>404 - Pagina no encontrada | Julian</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Hoja de Estilos Externa -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-lg);
        }

        .error-code {
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: var(--spacing-md);
            letter-spacing: -0.05em;
        }

        .error-message {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }

        .error-desc {
            color: var(--text-secondary);
            max-width: 500px;
            margin-bottom: var(--spacing-xl);
            font-weight: 300;
        }
    </style>
</head>

<body>
    <!-- Encabezado Fijo -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo" aria-label="Ir al inicio">Julian<span>.</span></a>
            <nav aria-label="Navegacion">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-message">Recurso no encontrado</h1>
            <p class="error-desc">
                La pagina, archivo o ruta a la que intentas acceder no existe o fue reubicada.
            </p>
            <a href="index.html" class="btn" aria-label="Volver a la pagina principal">Regresar al Portafolio</a>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p class="footer-text">&copy; 2026 Julian Forero.</p>
        </div>
    </footer>
</body>

</html>
