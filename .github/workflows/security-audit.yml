name: Security & Quality Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Ejecutar escaneo preventivo semanal cada lunes a las 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-integrity-audit:
    name: Code Integrity & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Check for Disallowed Tracked Files (.env, .vscode)
        run: |
          echo "Verificando ausencia de archivos sensibles en git..."
          if git ls-files | grep -E '\.vscode|\.env|\.pem|\.key'; then
            echo "ERROR: Se encontraron archivos sensibles o de configuracion local rastreados en git!"
            exit 1
          fi
          echo "Check de archivos sensibles: OK"

      - name: Run test suite (npm test)
        run: npm test
